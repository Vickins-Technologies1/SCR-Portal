apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.soranapropertymanagers.portal"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.soranapropertymanagers.portal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Make debug builds fast + debuggable by default.
            minifyEnabled false
        }
        release {
            // Enable R8 shrinking for production builds.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // You must provide a release keystore for Play Store builds.
                // See `android/keystore.properties.example`.
                logger.warn("keystore.properties not found. Release build will be unsigned and not Play Store-ready.")
            }
        }

        // Troubleshooting build: same as release but without R8 shrinking/minification.
        // Use this if a device shows "app keeps stopping" on startup (often due to missing ProGuard keep rules).
        releaseNoMinify {
            initWith release
            minifyEnabled false
            shrinkResources false
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        // Validate the package name inside google-services.json matches this appId to avoid silent FCM misconfiguration.
        try {
            def json = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
            def expectedPackage = android.defaultConfig.applicationId
            def hasMatch = (json?.client ?: []).any { c ->
                c?.client_info?.android_client_info?.package_name == expectedPackage
            }
            if (!hasMatch) {
                throw new GradleException("google-services.json is present but does not contain a client with package_name=${expectedPackage}. Re-download it from Firebase for the correct appId.")
            }
        } catch (Exception e) {
            throw new GradleException("Invalid google-services.json: ${e.message}", e)
        }

        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.warn("google-services.json not found; Firebase/FCM push token registration will be disabled until you add android/app/google-services.json")
    }
} catch(Exception e) {
    logger.warn("Failed to configure Firebase/FCM (google-services.json). Push Notifications won't work: ${e.message}")
}
