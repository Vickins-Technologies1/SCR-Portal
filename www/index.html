<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sorana</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: #0f172a;
        color: white;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        width: min(520px, 92vw);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        padding: 20px 18px;
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        opacity: 0.92;
        font-size: 13px;
        line-height: 1.45;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Loading…</h1>
      <p>
        This is the native wrapper for the Sorana web app.
        If you are seeing this screen, ensure <code>CAP_SERVER_URL</code> is set or update <code>capacitor.config.ts</code>.
      </p>
    </div>
  </body>
</html>
